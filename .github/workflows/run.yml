name: Auto Stock Analysis

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v5   # ⭐ 改这里
        with:
          python-version: "3.10"        # ⭐ 加引号

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python auto_run.py

      - name: 提交结果文件
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add auto_records.csv || true
        git add ai_summary.txt || true

        git commit -m "update auto records" || echo "No changes to commit"

        git push
